name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build, typecheck, test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - run: npm run test:check
      # Aggregate tarball smoke: install @lokascript/domains from a packed
      # tarball into a clean dir and exercise subpaths + registry dispatch.
      # Catches what workspace symlinks hide (files-array gaps, d.ts that
      # reference the private workspace names, exports-map typos).
      - run: bash scripts/pack-smoke.sh
